<span
  class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset whitespace-nowrap"
  [class]="classes()"
>
  <span class="size-1.5 rounded-full" [class]="dot()"></span>
  {{ label() }}
  @if (extra()) {
    <span class="opacity-70">· {{ extra() }}</span>
  }
</span>
