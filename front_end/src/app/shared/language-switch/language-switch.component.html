<div
  class="inline-flex items-center gap-0.5 rounded-xl p-1"
  [class]="variant() === 'dark' ? 'bg-white/5' : 'bg-white ring-1 ring-slate-200'"
  role="group"
  [attr.aria-label]="i18n.t('language.label')"
>
  @for (language of i18n.available; track language) {
    <button
      type="button"
      class="rounded-lg px-2.5 py-1 text-xs font-semibold uppercase transition"
      [class]="buttonClasses(language)"
      [attr.aria-pressed]="i18n.language() === language"
      (click)="select(language)"
    >
      {{ language }}
    </button>
  }
</div>
