<div
  class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] flex flex-col items-center gap-2 px-4"
  aria-live="polite"
  aria-atomic="false"
>
  @for (toast of service.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex w-full max-w-md items-start gap-3 rounded-xl px-4 py-3 text-sm shadow-lg"
      [class]="toneClass(toast.tone)"
      role="status"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button
        type="button"
        class="-my-1 grid shrink-0 cursor-pointer place-items-center rounded-md p-1 opacity-70 transition hover:bg-white/15 hover:opacity-100"
        [attr.aria-label]="i18n.t('common.close')"
        (click)="service.dismiss(toast.id)"
      >
        <svg viewBox="0 0 24 24" class="size-4 fill-current" aria-hidden="true">
          <path [attr.d]="icons.dismiss" />
        </svg>
      </button>
    </div>
  }
</div>
