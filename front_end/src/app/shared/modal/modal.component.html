<div class="fixed inset-0 z-50 flex items-end justify-center p-0 sm:items-center sm:p-6">
  <button
    type="button"
    class="absolute inset-0 bg-night-900/50 backdrop-blur-sm"
    [attr.aria-label]="i18n.t('common.close')"
    (click)="closed.emit()"
  ></button>

  <div
    class="relative flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:rounded-3xl"
    [class]="wide() ? 'sm:max-w-3xl' : 'sm:max-w-lg'"
    role="dialog"
    aria-modal="true"
  >
    <header class="flex shrink-0 items-start justify-between gap-4 border-b border-slate-100 px-6 py-5">
      <div>
        <h2 class="text-lg font-semibold text-slate-900">{{ title() }}</h2>
        @if (subtitle()) {
          <p class="mt-1 text-sm text-slate-500">{{ subtitle() }}</p>
        }
      </div>
      <button
        type="button"
        class="grid size-9 place-items-center rounded-xl text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
        [attr.aria-label]="i18n.t('common.close')"
        (click)="closed.emit()"
      >
        <svg viewBox="0 0 24 24" class="size-5 fill-current" aria-hidden="true">
          <path d="M6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z" />
        </svg>
      </button>
    </header>

    <!-- Seul le corps défile -->
    <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain px-6 py-5">
      <ng-content />
    </div>
  </div>
</div>
