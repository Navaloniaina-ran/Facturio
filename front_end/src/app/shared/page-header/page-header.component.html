<header class="card relative overflow-hidden">
  <span
    class="pointer-events-none absolute -top-28 -right-20 size-72 rounded-full blur-3xl"
    [class]="halo()"
    aria-hidden="true"
  ></span>

  <div class="relative flex flex-wrap items-start justify-between gap-4 p-5 sm:p-6">
    <div class="flex items-start gap-4">
      <span
        class="grid size-12 shrink-0 place-items-center rounded-2xl bg-gradient-to-br text-white shadow-lg"
        [class]="tile()"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24" class="size-6 fill-current">
          <path [attr.d]="icons[icon()]" />
        </svg>
      </span>

      <div>
        <h1 class="page-title text-2xl">{{ title() }}</h1>
        @if (subtitle()) {
          <p class="page-subtitle max-w-prose">{{ subtitle() }}</p>
        }
      </div>
    </div>

    <div class="flex flex-wrap gap-2"><ng-content /></div>
  </div>
</header>
