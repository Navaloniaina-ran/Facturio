spring.application.name=backend
# Charge les secrets locaux ignores par Git. Les variables du systeme gardent
# la priorite en production.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/facturio}
spring.datasource.username=${DATABASE_USERNAME:facturio}
spring.datasource.password=${DATABASE_PASSWORD:facturio}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# La V3 a aussi servi de baseline aux bases de developpement creees avant
# l'ajout de Flyway. Une base vide execute V3; une base V3 existante est
# simplement inscrite dans l'historique avant les migrations futures.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
# Cle HMAC des jetons Bearer. JWT_SECRET doit etre une valeur aleatoire d'au
# moins 32 caracteres en production.
facturio.jwt.secret=${JWT_SECRET:facturio-development-secret-change-me-2026}
facturio.jwt.ttl=${JWT_TTL:PT12H}

# Ne jamais journaliser les corps d'authentification, meme si une variable
# systeme DEBUG est definie par un outil de developpement.
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=INFO

# Angular relaie /api vers ce backend en developpement.
facturio.storage-path=${FACTURIO_STORAGE_PATH:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
